<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body{
            margin:0;
            font-family:Arial;
            background:linear-gradient(135deg,#0f172a,#1e293b);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:#1e293b;
            padding:40px;
            border-radius:15px;
            width:320px;
            box-shadow:0 0 25px rgba(0,0,0,0.4);
            text-align:center;
        }

        h2{
            color:#38bdf8;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:none;
            border-radius:8px;
            outline:none;
            font-size:15px;
        }

        button{
            width:100%;
            padding:12px;
            background:#38bdf8;
            border:none;
            border-radius:8px;
            color:white;
            font-size:16px;
            cursor:pointer;
            margin-top:10px;
        }

        button:hover{
            background:#0ea5e9;
        }

        a{
            display:block;
            margin-top:15px;
            color:#94a3b8;
            text-decoration:none;
        }

        a:hover{
            color:white;
        }
    </style>

</head>

<body>

<div class="card">

    <h2>Login</h2>

    <form method="POST">

        <input type="text" name="username" placeholder="Enter Username" required>

        <input type="password" name="password" placeholder="Enter Password" required>

        <button type="submit">Login</button>

    </form>

    <a href="/register">Create New Account</a>

</div>

</body>
</html>
